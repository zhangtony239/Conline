# Conline tmux defaults — comfortable defaults for a browser terminal.

# Colors
set -g default-terminal "screen-256color"

# UTF-8: make sure pane processes see an explicit UTF-8 locale.
# (The tmux *client* is separately forced to UTF-8 output via `tmux -u`
# in tmux-attach.sh; otherwise non-ASCII glyphs like • or ❯ get
# replaced with "_" at the output boundary.)
set-environment -g LANG "C.UTF-8"

# Long scrollback so history survives re-attach
set -g history-limit 50000

# Mouse support (wheel scroll enters copy-mode, easy text selection)
set -g mouse on

# Keep session output responsive
set -s escape-time 10
set -g status-interval 60

# hide status bar
set -g status off